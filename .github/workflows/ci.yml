# ─────────────────────────────────────────────────────────────────────────────
# SGDM - integrare continuă
#
# La fiecare push și pull request:
#   backend  → verifică perechile de migrări EF, dotnet build, dotnet test
#   frontend → npm ci, tsc -b, vite build, oxlint
#   docker   → docker compose config, imaginile api / web / backup,
#              nginx -t și un test HTTPS pe imaginea web, backup + restaurare
#              cap-coadă pe serviciile postgres și minio din compose (efemere)
#
# Joburile rulează în paralel: o eroare de TypeScript nu trebuie să aștepte
# după restaurarea pachetelor NuGet ca să fie raportată.
#
# Nu are nevoie de secrete: testele .NET sunt unitare, iar jobul docker
# pornește postgres și MinIO din compose, cu parolele-șablon din .env.example.
#
# LOCAȚIE: fișierul TREBUIE să stea în .github/workflows/ din rădăcina
# repository-ului. GitHub nu citește workflow-uri din subfoldere; cât timp a
# stat în frontend/.github/, CI-ul nu a rulat niciodată.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
  pull_request:

# Minimul necesar: workflow-ul doar citește codul. Un token cu drept de scriere
# ar însemna că o dependență compromisă din npm ar putea împinge în repo.
permissions:
  contents: read

# Un push nou pe aceeași ramură anulează rularea veche: rezultatul ei nu mai
# interesează pe nimeni, iar minutele de CI sunt limitate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Prinde exact bug-ul din 2026-09-09: o migrare fără .Designer.cs
      # compilează, dar EF Core nu o descoperă și nu o aplică niciodată.
      - name: Verifică perechile de migrări EF
        shell: bash
        run: |
          missing=0
          for f in MAI.DataAccessLayer/Migrations/2*_*.cs; do
            case "$f" in *.Designer.cs) continue ;; esac
            d="${f%.cs}.Designer.cs"
            if [ ! -f "$d" ]; then
              echo "::error file=$f::Lipsește $d - EF Core nu va aplica această migrare"
              missing=1
            fi
          done

          # Două migrări cu același timestamp au același ID; EF refuză să pornească
          # sau aplică doar una. S-a întâmplat pe 2026-09-17.
          dupes=$(ls MAI.DataAccessLayer/Migrations/2*_*.cs \
                    | grep -v '\.Designer\.cs$' \
                    | xargs -n1 basename \
                    | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Timestamp de migrare duplicat: $dupes"
            missing=1
          fi

          exit $missing

      - name: Restore
        run: dotnet restore MAI-Secure-Platform.sln

      - name: Build
        run: dotnet build MAI-Secure-Platform.sln --no-restore -c Release

      - name: Teste unitare
        run: >
          dotnet test MAI.Tests/MAI.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      # Testele de integrare pornesc un PostgreSQL real cu Testcontainers.
      # Docker e disponibil pe ubuntu-latest; containerul se creeaza si se
      # opreste automat. Rulam separat ca un esec unitar sa nu impiedice
      # si diagnosticul de integrare.
      - name: Teste de integrare (Testcontainers + PostgreSQL)
        run: >
          dotnet test MAI.IntegrationTests/MAI.IntegrationTests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      # Rezultatele raman descarcabile din pagina rularii, inclusiv cand testele
      # pica - exact atunci sunt utile.
      - name: Publica rezultatele testelor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (tsc -b, build, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, nu npm install: instalează exact ce e în package-lock.json și
      # pică dacă lock-ul nu corespunde cu package.json.
      - name: Instalare dependențe
        run: npm ci --no-audit --no-fund

      - name: Verificare tipuri
        run: npx tsc -b

      # vite build nu verifică tipurile; tsc -b nu verifică importurile dinamice
      # și bundle-ul. Amândouă trebuie să treacă pentru ca imaginea să se poată
      # construi.
      - name: Build de producție
        run: npx vite build

      - name: Lint
        run: npx oxlint

  docker:
    name: Docker (imagini, nginx, backup)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Numele proiectului compose fixează numele rețelei (sgdmci_default), la
    # care se atașează baza de test de mai jos.
    env:
      COMPOSE_PROJECT_NAME: sgdmci

    steps:
      - uses: actions/checkout@v4

      # .env.example e șablonul complet; fără el, compose ar interpola cu șiruri
      # goale și ar ascunde o variabilă scrisă greșit în docker-compose.yml.
      - name: Configurare de test
        run: cp .env.example .env

      - name: docker compose config
        run: docker compose --profile backup --profile ldap config --quiet

      - name: Imaginea API
        run: docker build --tag sgdm-api:ci .

      - name: Imaginea web
        run: docker build --tag sgdm-web:ci ./frontend

      - name: Imaginea de backup
        run: docker build --tag sgdm-backup:ci ./deploy/backup

      # nginx -t rulează prin entrypoint-ul imaginii, deci trec și scripturile
      # de pornire: generarea certificatului și înlocuirea variabilelor din
      # șablon. O variabilă SGDM_* lipsă sau o directivă greșită pică aici, nu
      # la prima pornire pe server.
      - name: nginx -t
        run: docker run --rm -e SGDM_SERVER_NAME=ci.local -e SGDM_PUBLIC_ORIGIN=https://ci.local sgdm-web:ci nginx -t

      - name: Test HTTPS pe imaginea web
        shell: bash
        run: |
          docker run -d --name ci-web -p 18080:80 -p 18443:443 \
            -e SGDM_SERVER_NAME=ci.local -e SGDM_PUBLIC_ORIGIN=https://ci.local sgdm-web:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:18080/healthz && break; sleep 1; done

          C="curl -sk --resolve ci.local:18443:127.0.0.1"

          # Pagina aplicației, cu CSP strictă ca antet.
          $C https://ci.local:18443/ | grep -q '<div id="root">'
          $C -D- -o /dev/null https://ci.local:18443/transfers | grep -qi "content-security-policy: .*connect-src 'self';"

          # Redirecționarea HTTP → HTTPS merge la originea fixă, nu la Host-ul primit.
          loc=$(curl -s -D- -o /dev/null -H 'Host: atacator.example' http://127.0.0.1:18080/x | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          test "$loc" = "https://ci.local/x"

          # TLS 1.1 refuzat.
          # „! comanda” NU opreste scriptul cand comanda reuseste: bash ignora
          # set -e pentru comenzile negate cu „!”. must_fail pica explicit.
          must_fail() { if "$@"; then echo "::error::A reusit, desi trebuia refuzat: $*"; exit 1; fi; }
          must_fail $C --tls-max 1.1 -o /dev/null https://ci.local:18443/ 2>/dev/null

          # Peste limita de 52 MB → 413 de la nginx, fără să ajungă la API.
          # „|| true”: nginx închide conexiunea după 413, iar curl poate raporta
          # eroare de trimitere; codul HTTP primit e cel care contează.
          code=$(head -c 60000000 /dev/zero | $C -o /dev/null -w '%{http_code}' -X POST --data-binary @- https://ci.local:18443/api/Transfers || true)
          test "$code" = "413"

      - name: Jurnalul containerului web
        if: failure()
        run: docker logs ci-web || true

      # Backup și restaurare pe serviciile REALE din compose: postgres (cu
      # parola din .env.example) și MinIO cu bucketul creat de minio-init.
      # Verifică exact ce contează: că un backup se poate restaura, nu doar că
      # se face. Plus: comanda „counts” și restaurarea cu --skip-policies,
      # folosite la mutarea bazei de pe Supabase.
      - name: Backup și restaurare cap-coadă
        shell: bash
        env:
          BACKUP_PASSPHRASE: ci-parola-backup
        run: |
          set -euo pipefail
          docker compose up -d postgres minio
          docker compose run --rm minio-init
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' sgdm-postgres)" = healthy ] && break
            sleep 2
          done

          # Doar cele necesare, citite explicit. „source .env” nu merge: valori
          # ca LDAP_GROUP_ROLE_MAPPINGS conțin „;”, pe care bash le-ar executa.
          env_value() { grep -E "^$1=" .env | head -n1 | cut -d= -f2-; }
          MINIO_ROOT_USER=$(env_value MINIO_ROOT_USER)
          MINIO_ROOT_PASSWORD=$(env_value MINIO_ROOT_PASSWORD)
          STORAGE_BUCKET=$(env_value STORAGE_BUCKET)
          PGUSER_CI=$(env_value POSTGRES_USER)
          PGDB_CI=$(env_value POSTGRES_DB)

          psql_ci() { docker exec -e PGPASSWORD="$(env_value POSTGRES_PASSWORD)" sgdm-postgres psql -h 127.0.0.1 -U "$PGUSER_CI" -d "$PGDB_CI" -v ON_ERROR_STOP=1 "$@"; }

          # Date de test, plus o politică RLS pentru un rol care nu există după
          # restaurare - exact situația unei baze venite de pe Supabase.
          psql_ci -c 'CREATE ROLE authenticated NOLOGIN;'
          psql_ci -c 'CREATE TABLE ci_probe(id int primary key, v text); INSERT INTO ci_probe VALUES (1, $$a$$), (2, $$b$$);'
          psql_ci -c 'ALTER TABLE ci_probe ENABLE ROW LEVEL SECURITY; CREATE POLICY p_ci ON ci_probe FOR SELECT TO authenticated USING (true);'

          # Un obiect în bucket, pe prefixul transferurilor.
          docker run --rm --network sgdmci_default --entrypoint sh quay.io/minio/mc:latest -c \
            "mc alias set l http://minio:9000 '$MINIO_ROOT_USER' '$MINIO_ROOT_PASSWORD' >/dev/null && echo cifrotext | mc pipe l/$STORAGE_BUCKET/transfers/ci/obiect.enc"

          docker compose --profile backup run --rm backup
          name=$(ls backups | grep '^20' | tail -n1)
          test -n "$name"
          echo "Backup: $name"

          docker compose --profile backup run --rm backup verify "$name"
          sudo test -f "backups/$name/database.dump.gpg"
          sudo test -f "backups/$name/storage/transfers/ci/obiect.enc"

          before=$(docker compose --profile backup run --rm backup counts)
          echo "$before"
          echo "$before" | grep -qx 'ci_probe 2'

          # Fără --yes, restaurarea trebuie refuzată.
          # „! comanda” NU opreste scriptul cand comanda reuseste: bash ignora
          # set -e pentru comenzile negate cu „!”. must_fail pica explicit.
          must_fail() { if "$@"; then echo "::error::A reusit, desi trebuia refuzat: $*"; exit 1; fi; }
          must_fail docker compose --profile backup run --rm backup restore "$name"

          # Rolul dispare, ca pe un PostgreSQL nou: fără --skip-policies,
          # restaurarea trebuie să eșueze și să lase baza neatinsă...
          psql_ci -c 'DROP POLICY p_ci ON ci_probe; DROP ROLE authenticated; DELETE FROM ci_probe WHERE id = 2;'
          must_fail docker compose --profile backup run --rm backup restore "$name" --yes --database-only
          test "$(psql_ci -tAc 'SELECT count(*) FROM ci_probe;')" = "1"

          # ...iar cu --skip-policies trebuie să reușească, cu toate rândurile.
          docker compose --profile backup run --rm backup restore "$name" --yes --skip-policies
          after=$(docker compose --profile backup run --rm backup counts)
          test "$before" = "$after"

          # Un fișier alterat în backup → verificarea pică.
          echo alterat | sudo tee -a "backups/$name/storage/transfers/ci/obiect.enc" >/dev/null
          must_fail docker compose --profile backup run --rm backup verify "$name"

      # Privilegii minime, verificate pe serviciile reale din compose:
      #   - migrate (db:migrate) aplica migrarile pe o baza fara schema si creeaza
      #     rolul aplicatiei; rulat de doua ori, ca sa dovedeasca idempotenta;
      #   - rolul aplicatiei citeste si scrie, dar NU poate modifica sau sterge
      #     jurnalul de audit si nu poate crea tabele;
      #   - contul de serviciu MinIO scrie in bucketul lui, dar nu poate crea
      #     bucketuri, schimba retentia sau administra MinIO.
      # ASPNETCORE_ENVIRONMENT=Development doar aici: parolele din .env.example
      # sunt sabloane, pe care db:migrate le refuza in Production.
      - name: Migrari, rolul aplicatiei si contul de serviciu MinIO
        shell: bash
        run: |
          set -euo pipefail
          # Imaginea construita mai sus, sub numele folosit de serviciul migrate.
          docker tag sgdm-api:ci sgdm-api:latest

          env_value() { grep -E "^$1=" .env | head -n1 | cut -d= -f2-; }
          PGDB_CI=$(env_value POSTGRES_DB)
          APP_USER=$(env_value POSTGRES_APP_USER)
          APP_PW=$(env_value POSTGRES_APP_PASSWORD)

          docker compose up -d postgres minio
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' sgdm-postgres)" = healthy ] && break
            sleep 2
          done

          docker compose run --rm -e ASPNETCORE_ENVIRONMENT=Development migrate
          docker compose run --rm -e ASPNETCORE_ENVIRONMENT=Development migrate
          docker compose run --rm -e ASPNETCORE_ENVIRONMENT=Development migrate db:migrate --list

          psql_app() { docker exec -e PGPASSWORD="$APP_PW" sgdm-postgres psql -h 127.0.0.1 -U "$APP_USER" -d "$PGDB_CI" -v ON_ERROR_STOP=1 "$@"; }

          psql_app -c 'SELECT count(*) FROM "Users";'
          psql_app -c "INSERT INTO \"AuditLogs\" (\"Id\", \"Username\", \"Action\", \"Details\", \"Result\", \"IpAddress\", \"Timestamp\") VALUES (gen_random_uuid(), 'ci', 0, 'ci', 0, '127.0.0.1', now());"
          # „! comanda” NU opreste scriptul cand comanda reuseste: bash ignora
          # set -e pentru comenzile negate cu „!”. must_fail pica explicit.
          must_fail() { if "$@"; then echo "::error::A reusit, desi trebuia refuzat: $*"; exit 1; fi; }
          must_fail psql_app -c 'UPDATE "AuditLogs" SET "Details" = $$modificat$$;'
          must_fail psql_app -c 'DELETE FROM "AuditLogs";'
          must_fail psql_app -c 'TRUNCATE "AuditLogs";'
          must_fail psql_app -c 'CREATE TABLE ci_ddl_interzis (id int);'
          must_fail psql_app -c 'DELETE FROM "__EFMigrationsHistory";'

          # MinIO: minio-init a creat contul la pasul de backup; il rulam din
          # nou, ca si aici sa fie dovedita idempotenta (detach/attach, user add).
          docker compose run --rm minio-init
          BUCKET=$(env_value STORAGE_BUCKET)
          S3_USER=$(env_value MINIO_APP_USER)
          S3_PW=$(env_value MINIO_APP_PASSWORD)
          mc_app() {
            docker run --rm --network sgdmci_default --entrypoint sh quay.io/minio/mc:latest -c \
              "mc alias set a http://minio:9000 '$S3_USER' '$S3_PW' >/dev/null && $1"
          }
          mc_app "echo ci | mc pipe a/$BUCKET/transfers/ci/app.enc"
          mc_app "mc cat a/$BUCKET/transfers/ci/app.enc"
          mc_app "mc rm a/$BUCKET/transfers/ci/app.enc"
          must_fail mc_app "mc mb a/alt-bucket-ci"
          must_fail mc_app "mc version suspend a/$BUCKET"
          must_fail mc_app "mc ilm rule rm --all --force a/$BUCKET"
          must_fail mc_app "mc admin user list a"

      - name: Curățenie
        if: always()
        run: |
          docker rm -f ci-web >/dev/null 2>&1 || true
          docker compose --profile backup down -v >/dev/null 2>&1 || true

