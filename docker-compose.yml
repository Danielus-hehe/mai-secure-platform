# ─────────────────────────────────────────────────────────────────────────────
# SGDM - infrastructura locala
#
# Ridica un MinIO auto-gazduit (S3-compatible) in care API-ul .NET pune
# cifrotextul transferurilor. Serverul nu poate citi continutul: fisierele
# ajung aici deja criptate AES-256-GCM in browser, iar cheia de fisier e
# impachetata RSA-OAEP pentru destinatar. MinIO vede doar octeti opaci.
#
# Doua moduri de lucru (detalii in docs/DEPLOYMENT.md):
#
#   Dezvoltare - baza si stocarea in Docker, API-ul cu 'dotnet run':
#     docker compose up -d postgres minio minio-init
#
#   Tot in Docker - MinIO + API + web (nginx cu HTTPS si frontend-ul):
#     docker compose up -d --build
#     Aplicatia: https://<SGDM_SERVER_NAME>  (implicit https://sgdm.local)
#     (.env trebuie completat cu secrete reale: in afara mediului Development,
#      API-ul refuza sa porneasca daca vreunul a ramas pe valoarea-sablon)
#
#   Backup (la cerere sau programat):
#     docker compose --profile backup run --rm backup
#
# Oprire:    docker compose down          (datele raman in volum)
# Stergere:  docker compose down -v       (STERGE si datele!)
# Consola:   http://localhost:9001        (doar de pe masina gazda)
#
# ── Ce e expus in afara masinii ──────────────────────────────────────────────
# Doar porturile 80 si 443 ale serviciului web. API-ul nu mai are port pe
# gazda (ajunge la el doar nginx, prin reteaua interna), iar MinIO si
# PostgreSQL asculta doar pe 127.0.0.1: API-ul pornit cu 'dotnet run' le
# gaseste, un alt calculator din retea nu. Fara asta, oricine din LAN putea
# incerca parole direct pe baza, pe consola MinIO, sau ocoli nginx cu totul.
#
# ── Structura cheilor ────────────────────────────────────────────────────────
# Transferuri:  transfers/{yyyy}/{MM}/{transferId:N}.enc
#               (cele vechi pot avea inca prefixul departamentului)
# Documente:    documents/{docId:N}/v{n}-{incercare:N}.{ext}
#               (cele vechi: v{n}.{ext}; sufixul unic impiedica doua incarcari
#                simultane sa scrie in acelasi obiect)
# Interne:      internal/{yyyy}/{MM}/{docId:N}-{id}.{ext}
#
# Toate stau in acelasi bucket ("mai-secure"). Transferurile sunt criptate in
# browser (E2EE); documents/ si internal/ sunt criptate de API inainte de
# MinIO (AES-256-GCM, cheie per fisier, cheia principala din .env). In MinIO
# nu exista niciun fisier in clar (dupa storage:recrypt pentru cele vechi).
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL - baza de date a aplicatiei
  #
  # Inainte, baza statea pe Supabase (cloud). Mutata aici, pentru ca platforma
  # e pentru intranetul MAI: conturile, jurnalul de audit si metadatele
  # transferurilor nu au ce cauta pe un server din afara institutiei. In plus,
  # demonstratia nu mai depinde de internet.
  #
  # Mutarea datelor din Supabase: scripts/migrate-db-to-docker.ps1
  # (backup din sursa, restaurare aici, comparatie rand cu rand pe tabele).
  #
  # Versiunea 17: aceeasi majora ca pg_dump din imaginea de backup. Un pg_dump
  # mai vechi decat serverul refuza sa lucreze; unul mai nou merge oricand.
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: sgdm-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgdm}
      POSTGRES_USER: ${POSTGRES_USER:-sgdm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # scram-sha-256 si pentru conexiunile locale din container, nu doar pentru
      # cele din retea: fara el, initdb pune „trust” pe socketul local.
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"

    ports:
      # Doar pe gazda: pentru 'dotnet run', 'dotnet ef' si un client (DataGrip,
      # DBeaver). Din LAN baza nu e accesibila. Portul se schimba din .env daca
      # pe Windows ruleaza deja un PostgreSQL instalat pe 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - pg-data:/var/lib/postgresql/data

    healthcheck:
      # -h 127.0.0.1: verifica si ascultarea pe TCP, nu doar socketul local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # Registrul: Chainguard (cgr.dev), NU MinIO. MinIO nu mai publica imagini
    # pentru comunitate: minio/minio si minio/mc au disparut de pe Docker Hub
    # (11.09.2026), iar quay.io/minio/* raspunde 401 la orice pull anonim
    # (24.09.2026), inclusiv pentru versiuni fixate. Chainguard compileaza
    # MinIO din sursa si publica gratuit eticheta 'latest'; binarul e acelasi
    # server, cu aceeasi comanda (server /data) si cu mc inclus (healthcheck).
    #
    # Imaginile deja descarcate raman in cache-ul Docker local si merg in
    # continuare; problema apare pe o masina curata (server nou, CI).
    #
    # Productie: fixati imaginea pe digest (cgr.dev/chainguard/minio@sha256:...),
    # luat cu 'docker inspect --format "{{index .RepoDigests 0}}"'. Pe termen
    # lung, stocarea poate fi mutata pe o alternativa intretinuta (SeaweedFS,
    # Garage); API-ul vorbeste S3 standard, deci schimbarea e de configurare.
    image: cgr.dev/chainguard/minio:latest
    container_name: sgdm-minio
    restart: unless-stopped

    # Imaginea Chainguard ruleaza implicit ca utilizator neprivilegiat, dar
    # volumul minio-data a fost creat de imaginea oficiala, care rula ca root:
    # fisierele sunt ale lui root, iar serverul nu le-ar putea citi. Ramane
    # root, ca inainte, pana la o migrare explicita a drepturilor pe volum.
    user: "0:0"

    # server /data   → unde tine obiectele
    # --console-address → portul interfetei web de administrare
    command: server /data --console-address ":9001"

    environment:
      # Credentialele de administrator ale MinIO. In .env, NU aici.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Browserul descarca cifrotextul direct de la MinIO (URL presemnat),
      # deci originea frontend-ului trebuie permisa explicit. In productie
      # se pune doar domeniul real al aplicatiei, nu '*'.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://localhost:3000"

      # Regiunea nu conteaza functional la MinIO, dar SDK-ul AWS o cere.
      MINIO_REGION_NAME: us-east-1

    ports:
      # 127.0.0.1: accesibile doar de pe gazda. In modul de dezvoltare API-ul
      # (dotnet run) se conecteaza la localhost:9000; in modul Docker, la
      # minio:9000 prin reteaua interna. Niciunul nu are nevoie de LAN.
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # Consola web de administrare

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ───────────────────────────────────────────────────────────────────────────
  # Container efemer: creeaza bucketul si politica de retentie, apoi iese.
  # Ruleaza la fiecare 'up', dar operatiile sunt idempotente.
  #
  # ── Regula ILM ────────────────────────────────────────────────────────────
  # Expirarea automata (30 de zile) se aplica DOAR sub prefixul "transfers/".
  #
  # Istoric: cheile transferurilor au avut o vreme ca prefix departamentul
  # expeditorului ("directia-it/…"), deci nu exista un prefix comun, iar regula
  # expira TOT bucketul dupa 30 de zile - inclusiv documentele normative
  # ("documents/") si cele interne ("internal/"), care trebuie pastrate. Acum
  # transferurile noi se scriu sub "transfers/{yyyy}/{MM}/", iar regula le
  # tinteste doar pe ele. Transferurile vechi, cu prefix de departament, sunt
  # curatate de jobul de expirare din API (TransferExpirationService), care
  # ramane oricum prima linie de aparare (actioneaza in maximum 15 minute).
  #
  # Versionare + stergere: pe un bucket versionat, DeleteObject fara VersionId
  # NU sterge octetii - pune un "delete marker", iar obiectul devine versiune
  # noncurenta. Fara --noncurrent-expire-days, retragerea si jobul de expirare
  # lasau cifrotextul in bucket pentru totdeauna, desi interfata spunea "sters".
  # Acum versiunile vechi dispar fizic dupa o zi.
  #
  # Regulile ILM se sterg si se recreeaza la fiecare pornire. 'mc ilm rule add'
  # nu e idempotent - fiecare 'up' adauga inca o regula cu ID nou. Fara '|| true'
  # la adaugare: daca regula nu se poate crea, containerul trebuie sa esueze
  # vizibil, nu sa raporteze "MinIO pregatit" fara retentie.
  # ───────────────────────────────────────────────────────────────────────────
  minio-init:
    # Varianta -dev: are shell (scriptul de mai jos); cea minimala are doar mc.
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: sgdm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SGDM_BUCKET: ${STORAGE_BUCKET:-mai-secure}
      # Contul de serviciu al API-ului (vezi mai jos, sub script).
      SGDM_APP_USER: ${MINIO_APP_USER:-sgdm-app}
      SGDM_APP_SECRET: ${MINIO_APP_PASSWORD:-}

    # Script bloc (|), nu linie pliata (>): politica contului de serviciu e un
    # JSON pe mai multe randuri. „$$” e un „$” pentru shell, nu pentru compose.
    #
    # ── Contul de serviciu al API-ului ────────────────────────────────────────
    # Inainte, API-ul folosea credentialele root ale MinIO. Cine compromitea
    # API-ul (sau citea variabilele containerului) putea sterge bucketul,
    # dezactiva versionarea, schimba regulile de retentie si crea conturi noi.
    # Acum API-ul are un cont care poate doar citi, scrie si sterge obiecte in
    # bucketul propriu. Versionarea ramane activa si un obiect sters se poate
    # recupera 24 de ore, iar root ramane doar aici si in serviciul de backup.
    # Comenzile sunt idempotente: parola se actualizeaza, politica se rescrie,
    # iar detach inainte de attach evita eroarea „policy already attached”.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

        mc mb --ignore-existing "local/$$SGDM_BUCKET"

        echo '→ bucket privat (fara acces anonim)'
        mc anonymous set none "local/$$SGDM_BUCKET"

        echo '→ versionare activata: o stergere gresita se poate anula 24 de ore'
        mc version enable "local/$$SGDM_BUCKET"

        echo '→ retentie: transfers/ 30 de zile; versiuni sterse 1 zi; documents/ si internal/ fara expirare'
        mc ilm rule rm --all --force "local/$$SGDM_BUCKET" >/dev/null 2>&1 || true
        mc ilm rule add --prefix 'transfers/' --expire-days 30 "local/$$SGDM_BUCKET"
        mc ilm rule add --noncurrent-expire-days 1 "local/$$SGDM_BUCKET"

        echo '→ cont de serviciu pentru API, limitat la bucket'
        if [ -z "$$SGDM_APP_USER" ] || [ -z "$$SGDM_APP_SECRET" ]; then
          echo 'EROARE: MINIO_APP_USER si MINIO_APP_PASSWORD trebuie setate in .env (parola: minim 8 caractere).' >&2
          exit 1
        fi
        if [ "$$SGDM_APP_USER" = "$$MINIO_ROOT_USER" ]; then
          echo 'EROARE: MINIO_APP_USER trebuie sa difere de MINIO_ROOT_USER.' >&2
          exit 1
        fi

        # GetBucketLocation + ListBucket pe bucket; Get/Put/DeleteObject in el.
        # Nimic pe alte bucketuri, nimic administrativ, nimic pe versiuni
        # (DeleteObjectVersion): o stergere facuta de API lasa mereu un obiect
        # recuperabil pana la expirarea versiunii necurente.
        POLICY="{
          \"Version\": \"2012-10-17\",
          \"Statement\": [
            {
              \"Effect\": \"Allow\",
              \"Action\": [\"s3:GetBucketLocation\", \"s3:ListBucket\"],
              \"Resource\": [\"arn:aws:s3:::$${SGDM_BUCKET}\"]
            },
            {
              \"Effect\": \"Allow\",
              \"Action\": [\"s3:GetObject\", \"s3:PutObject\", \"s3:DeleteObject\"],
              \"Resource\": [\"arn:aws:s3:::$${SGDM_BUCKET}/*\"]
            }
          ]
        }"
        printf '%s\n' "$$POLICY" > /tmp/sgdm-app-policy.json
        mc admin policy create local sgdm-app /tmp/sgdm-app-policy.json
        mc admin user add local "$$SGDM_APP_USER" "$$SGDM_APP_SECRET"
        mc admin policy detach local sgdm-app --user "$$SGDM_APP_USER" >/dev/null 2>&1 || true
        mc admin policy attach local sgdm-app --user "$$SGDM_APP_USER"

        echo ''
        echo '=== MinIO pregatit ==='
        mc ls local

  # ───────────────────────────────────────────────────────────────────────────
  # Migrari si rolul aplicatiei in PostgreSQL (container efemer)
  #
  # Ruleaza „db:migrate” din imaginea API-ului, la fiecare 'up', inaintea
  # API-ului: aplica migrarile EF in asteptare si (re)creeaza rolul aplicatiei
  # cu drepturi minime. Serverul nu mai are nevoie de SDK-ul .NET si nici de
  # codul sursa - doar de Docker. Manual:
  #   docker compose run --rm migrate                       (aplica)
  #   docker compose run --rm migrate db:migrate --list     (doar afiseaza starea)
  # Argumentele dupa numele serviciului INLOCUIESC comanda, deci „db:migrate”
  # se repeta cand se adauga --list.
  #
  # Se conecteaza cu PROPRIETARUL schemei (POSTGRES_USER), singurul care are
  # voie sa schimbe structura. API-ul foloseste rolul aplicatiei
  # (POSTGRES_APP_USER): SELECT/INSERT/UPDATE/DELETE pe tabele, dar pe
  # AuditLogs doar SELECT si INSERT - jurnalul nu poate fi modificat sau sters
  # nici de un API compromis. Detalii: MAI.DataAccessLayer/Maintenance/.
  #
  # Primeste doar conexiunea si rolul, niciun alt secret (JWT, pepper, SMTP):
  # comanda nu trece prin validarile din Program.cs.
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: sgdm-api:latest
    container_name: sgdm-migrate
    command: ["db:migrate"]
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ConnectionStrings__DefaultConnection: ${DB_CONTAINER_CONNECTION_STRING:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-sgdm};Username=${POSTGRES_USER:-sgdm};Password=${POSTGRES_PASSWORD}}
      Database__AppUser: ${POSTGRES_APP_USER:-sgdm_app}
      MAI_DB_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      # In Docker, rularea fara rolul aplicatiei e o eroare, nu o optiune: API-ul
      # de mai jos se conecteaza cu el.
      Database__RequireAppRole: "true"

  # ───────────────────────────────────────────────────────────────────────────
  # API-ul .NET
  #
  # Toate secretele vin din .env, niciunul din appsettings.json. Fisierul de
  # configurare versionat contine doar valori-sablon, iar Program.cs opreste
  # pornirea daca vreuna a ramas neinlocuita - un server care ruleaza cu cheia
  # "YOUR_JWT_SECRET_KEY_HERE" e mai rau decat unul care nu porneste, pentru ca
  # primul pare ca functioneaza.
  # ───────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sgdm-api:latest
    container_name: sgdm-api
    restart: unless-stopped

    # Porneste doar dupa ce bucketul, versionarea si regulile de retentie exista.
    # Fara conditia pe minio-init, primul upload putea ajunge intr-un bucket
    # creat de API, fara versionare si fara expirare.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Schema la zi si rolul aplicatiei creat, inainte de prima cerere.
      migrate:
        condition: service_completed_successfully

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Conexiunea la baza, VAZUTA DIN CONTAINER, cu ROLUL APLICATIEI (nu cu
      # proprietarul): fara DDL, fara UPDATE/DELETE pe jurnalul de audit. Rolul
      # il creeaza serviciul „migrate” de mai sus, la fiecare 'up'.
      #
      # DB_CONNECTION_STRING din .env NU se foloseste aici: el e pentru
      # 'dotnet run', unde hostul e localhost. In container, localhost e
      # containerul insusi. Pentru o baza externa (alt server PostgreSQL al
      # institutiei): DB_CONTAINER_APP_CONNECTION_STRING (rolul aplicatiei)
      # si DB_CONTAINER_CONNECTION_STRING (proprietarul, pentru migrate si backup).
      ConnectionStrings__DefaultConnection: ${DB_CONTAINER_APP_CONNECTION_STRING:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-sgdm};Username=${POSTGRES_APP_USER:-sgdm_app};Password=${POSTGRES_APP_PASSWORD:-}}

      # Secrete - generate cu:  openssl rand -base64 48
      MAI_JWT_KEY: ${MAI_JWT_KEY}
      MAI_ARGON2_PEPPER: ${MAI_ARGON2_PEPPER}
      MAI_TWOFACTOR_KEY: ${MAI_TWOFACTOR_KEY}

      # Endpointul MinIO vazut DIN container. Browserul, in schimb, primeste
      # URL-uri presemnate care trebuie sa fie rezolvabile de pe masina lui -
      # de aceea in productie ambele trebuie sa arate spre acelasi nume DNS.
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: ${STORAGE_BUCKET:-mai-secure}

      # URL-urile presemnate se semneaza pentru hostul din Storage__Endpoint,
      # adica "minio" - un nume care exista doar in reteaua Docker. Browserul
      # nu il poate rezolva, deci descarcarea directa ar esua. In acest mod,
      # cifrotextul trece prin API (/api/Transfers/{id}/content). Pentru URL-uri
      # presemnate in productie, MinIO trebuie expus sub un nume DNS comun,
      # vazut la fel si de API, si de browser.
      Storage__UsePresignedDownload: "false"
      # Contul de serviciu creat de minio-init, limitat la bucketul aplicatiei.
      # Root ramane doar la minio-init si la backup.
      MAI_STORAGE_ACCESS_KEY: ${MINIO_APP_USER:-sgdm-app}
      MAI_STORAGE_SECRET_KEY: ${MINIO_APP_PASSWORD:-}

      # Criptarea la nivel de aplicatie a documentelor (documents/, internal/).
      # Cheile principale raman in .env; in imagine si in Git nu ajung niciodata.
      # Recriptare / rotire:  docker compose run --rm api storage:recrypt --dry-run
      MAI_STORAGE_MASTER_KEYS: ${MAI_STORAGE_MASTER_KEYS:-}
      StorageEncryption__ActiveKeyId: ${STORAGE_ENCRYPTION_ACTIVE_KEY:-}
      StorageEncryption__Enabled: ${STORAGE_ENCRYPTION_ENABLED:-true}
      # Implicit false: un obiect in clar pus in locul unuia criptat e refuzat.
      # true doar temporar, cat timp mai exista fisiere necriptate (inainte de
      # storage:recrypt).
      StorageEncryption__AllowPlaintextRead: ${STORAGE_ENCRYPTION_ALLOW_PLAINTEXT:-false}

      # Originea frontend-ului. In spatele nginx, pagina si /api au aceeasi
      # origine si CORS nu mai intervine; valoarea ramane corecta pentru cazul
      # in care cineva deschide frontend-ul de dezvoltare spre acest API.
      Cors__AllowedOrigins__0: ${SGDM_PUBLIC_ORIGIN:-https://sgdm.local}

      # Adresa din linkurile trimise pe email (activare cont, resetare parola).
      # Trebuie sa fie exact adresa la care utilizatorii deschid aplicatia.
      Frontend__BaseUrl: ${SGDM_PUBLIC_ORIGIN:-https://sgdm.local}

      # SMTP pentru notificari si invitatii. Lasate goale, API-ul porneste fara
      # email: conturile noi primesc parola temporara, transferurile nu notifica.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-465}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__Username: ${SMTP_USERNAME:-}
      MAI_SMTP_PASSWORD: ${MAI_SMTP_PASSWORD:-}

      # Politica transferurilor: valabilitate implicita / maxima (zile) si
      # numarul maxim de destinatari. Frontend-ul le citeste din
      # GET /api/Transfers/policy, deci se schimba doar aici (in .env).
      Transfers__DefaultExpiryDays: ${TRANSFER_DEFAULT_EXPIRY_DAYS:-7}
      Transfers__MaxExpiryDays: ${TRANSFER_MAX_EXPIRY_DAYS:-30}
      Transfers__MaxRecipients: ${TRANSFER_MAX_RECIPIENTS:-20}

      # Valabilitatea linkului de resetare a parolei trimis pe email (minute).
      PasswordReset__TokenMinutes: ${PASSWORD_RESET_TOKEN_MINUTES:-120}

      # Durata absoluta a sesiunii (ore de la autentificare). Refresh-ul nu o
      # mai poate prelungi; dupa ea se cere din nou parola si codul 2FA.
      Jwt__SessionAbsoluteHours: ${SESSION_ABSOLUTE_HOURS:-12}

      # ── Active Directory (LDAP) ──────────────────────────────────────────
      # Implicit dezactivat: aplicatia porneste identic fara domeniu, iar
      # conturile locale functioneaza ca inainte. Detalii si provizionarea unui
      # Samba AD de test: docs/LDAP-AD.md
      Ldap__Enabled: ${LDAP_ENABLED:-false}
      Ldap__Host: ${LDAP_HOST:-}
      Ldap__Port: ${LDAP_PORT:-636}
      Ldap__UseLdaps: ${LDAP_USE_LDAPS:-true}
      Ldap__UseStartTls: ${LDAP_USE_STARTTLS:-false}
      Ldap__AllowInsecurePlaintext: ${LDAP_ALLOW_PLAINTEXT:-false}
      Ldap__BaseDn: ${LDAP_BASE_DN:-}
      Ldap__UserSearchBase: ${LDAP_USER_SEARCH_BASE:-}
      Ldap__OrgUnitSearchBase: ${LDAP_OU_SEARCH_BASE:-}
      Ldap__Realm: ${LDAP_REALM:-}
      Ldap__NetbiosDomain: ${LDAP_NETBIOS_DOMAIN:-}
      Ldap__BindDn: ${LDAP_BIND_DN:-}
      MAI_LDAP_BIND_PASSWORD: ${MAI_LDAP_BIND_PASSWORD:-}
      Ldap__GroupRoleMappings: ${LDAP_GROUP_ROLE_MAPPINGS:-}
      Ldap__DefaultRole: ${LDAP_DEFAULT_ROLE:-Utilizator}
      Ldap__AutoCreateUsers: ${LDAP_AUTO_CREATE:-true}
      Ldap__SyncOnLogin: ${LDAP_SYNC_ON_LOGIN:-true}
      Ldap__DepartmentAttribute: ${LDAP_DEPARTMENT_ATTRIBUTE:-department}

      # Validarea certificatului DC-ului IN CONTAINER.
      #
      # Pe Linux, biblioteca LDAP de dedesubt este OpenLDAP, iar ea - nu
      # aplicatia - verifica certificatul, dupa variabilele LDAPTLS_*. Amprenta
      # fixata (LDAP_CERT_THUMBPRINT) merge doar cand API-ul ruleaza pe Windows;
      # in container se foloseste CA-ul (LDAP_CA_FILE), iar API-ul refuza sa
      # porneasca daca cele doua variabile de mai jos nu corespund.
      #
      # LDAP_CONTAINER_CA_FILE are prioritate fata de LDAP_CA_FILE. Motivul: cu
      # API-ul pornit prin 'dotnet run' pe Windows, LDAP_CA_FILE e o cale
      # Windows (C:\...\ad-ca.pem), care in container nu exista. Cu doua
      # variabile, acelasi .env serveste ambele moduri fara editari la comutare.
      Ldap__ServerCertificateThumbprint: ${LDAP_CERT_THUMBPRINT:-}
      Ldap__CaCertificatePath: ${LDAP_CONTAINER_CA_FILE:-${LDAP_CA_FILE:-}}
      Ldap__AllowUntrustedCertificate: ${LDAP_ALLOW_UNTRUSTED_CERT:-false}

      # Fara LDAP_CA_FILE, OpenLDAP foloseste magazinul de incredere al
      # sistemului (potrivit pentru un DC cu certificat emis de o autoritate
      # recunoscuta). "demand" = certificatul si numele din el se verifica
      # obligatoriu; orice alta valoare e refuzata de API in Production.
      LDAPTLS_CACERT: ${LDAP_CONTAINER_CA_FILE:-${LDAP_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}}
      LDAPTLS_REQCERT: ${LDAP_TLS_REQCERT:-demand}

      # ── In spatele nginx ─────────────────────────────────────────────────
      # Fara BehindReverseProxy, RemoteIpAddress ar fi IP-ul nginx pentru TOATE
      # cererile: un singur utilizator care greseste parola de 10 ori ar bloca
      # autentificarea pentru toata institutia, iar jurnalul de audit ar
      # inregistra acelasi IP pentru toata lumea.
      #
      # KnownProxies: API-ul crede antetul X-Forwarded-For DOAR cand cererea
      # vine de la acest IP - cel fixat pentru serviciul web mai jos. Oricine
      # altcineva care trimite antetul (alt container, un client direct) e
      # ignorat. De aceea IP-ul e fix: o lista de retele intregi ar fi insemnat
      # sa avem incredere in orice container din retea.
      RateLimit__BehindReverseProxy: "true"
      RateLimit__KnownProxies__0: ${SGDM_PROXY_IP:-172.28.0.10}

      # Restrictia la retele interne (RFC 1918). Dupa UseForwardedHeaders se
      # aplica pe IP-ul real al clientului, nu pe cel al nginx.
      Intranet__Enabled: ${INTRANET_ONLY:-false}
      # true = doar jurnalizeaza cine AR FI fost respins. Modul in care se
      # activeaza restrictia pe un sistem viu: o zi asa, jurnalul verificat,
      # apoi false.
      Intranet__AuditOnly: ${INTRANET_AUDIT_ONLY:-false}

      # 2FA obligatoriu pentru Administrator si SefDirectie pe endpointurile
      # privilegiate. Ramane false pana isi activeaza 2FA toti administratorii:
      # pornit mai devreme, ii blocheaza exact pe cei care l-ar putea configura.
      TwoFactor__RequiredForPrivilegedRoles: ${TWOFACTOR_REQUIRED_PRIVILEGED:-false}

    # Fara port pe gazda: API-ul se acceseaza doar prin nginx (https://.../api).
    # Un port deschis direct ar ocoli TLS, antetele si limita de marime din
    # nginx. 'expose' documenteaza portul pentru ceilalti din retea.
    expose:
      - "8080"

    # Doar pentru Storage:Provider=Local. Cu MinIO ramane nefolosit, dar exista
    # ca sa nu se piarda fisiere daca cineva comuta providerul si reporneste.
    volumes:
      - api-storage:/app/Storage
      # Documentele NOI merg in MinIO, sub documents/. Volumul ramane pentru
      # versiunile scrise inainte de aceasta schimbare, care au in baza o cale
      # absoluta sub /app/uploads/documents si se citesc in continuare de acolo.
      # Fara volum, un 'docker compose up --build' le-ar sterge.
      - api-uploads:/app/uploads
      # Certificatul CA al controlerului de domeniu, daca se valideaza cu CA
      # propriu (LDAP_CA_FILE=/app/certs/ad-ca.pem). Directorul poate ramane gol.
      - ./certs:/app/certs:ro

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ───────────────────────────────────────────────────────────────────────────
  # Web: nginx cu HTTPS, frontend-ul React si reverse proxy spre API
  #
  # Construit din frontend/Dockerfile. Browserul vorbeste doar cu acest
  # serviciu: paginile statice direct, /api/ mai departe spre containerul api.
  #
  # Certificatul: ./certs/tls/tls.crt + tls.key. Daca lipsesc, se genereaza
  # unul autosemnat la prima pornire (SGDM_SELF_SIGNED=true), pastrat in
  # acelasi director. Pe Windows, scripts/trust-dev-cert.ps1 il face de
  # incredere in browser. In productie: certificatul institutiei si
  # SGDM_SELF_SIGNED=false.
  # ───────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Cale relativa: bundle-ul cheama /api pe aceeasi origine. Nu se ia
        # VITE_API_URL din .env - acolo e adresa pentru 'npm run dev'.
        VITE_API_URL: /api
    image: sgdm-web:latest
    container_name: sgdm-web
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    environment:
      SGDM_SERVER_NAME: ${SGDM_SERVER_NAME:-sgdm.local}
      SGDM_PUBLIC_ORIGIN: ${SGDM_PUBLIC_ORIGIN:-https://sgdm.local}
      SGDM_API_UPSTREAM: api:8080
      SGDM_SELF_SIGNED: ${SGDM_SELF_SIGNED:-true}

    ports:
      - "${SGDM_HTTP_PORT:-80}:80"
      - "${SGDM_HTTPS_PORT:-443}:443"

    volumes:
      # Nu :ro - la prima pornire scriptul scrie aici certificatul autosemnat,
      # ca sa fie acelasi dupa fiecare restart.
      - ./certs/tls:/etc/nginx/tls

    networks:
      default:
        # IP fix: e singura adresa de la care API-ul accepta X-Forwarded-For
        # (RateLimit__KnownProxies__0). Trebuie sa fie in SGDM_DOCKER_SUBNET.
        ipv4_address: ${SGDM_PROXY_IP:-172.28.0.10}

    healthcheck:
      # Pe HTTP, portul 80: sonda nu depinde de certificat. wget e in busybox.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────────
  # Backup: baza de date (pg_dump) + bucketul MinIO, in ./backups/
  #
  # Nu porneste la 'up' (profilul "backup"); ruleaza si iese:
  #   docker compose --profile backup run --rm backup
  #   docker compose --profile backup run --rm backup list
  #   docker compose --profile backup run --rm backup verify <nume>
  #   docker compose --profile backup run --rm backup restore <nume> --yes
  #
  # Foloseste ACEEASI conexiune ca API-ul din container (aceeasi expresie):
  # un backup facut dintr-o alta baza decat cea pe care ruleaza aplicatia e
  # cel mai rau tip de backup - arata bine pana in ziua in care e nevoie de el.
  # Detalii: docs/DEPLOYMENT.md.
  # ───────────────────────────────────────────────────────────────────────────
  backup:
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    image: sgdm-backup:latest
    container_name: sgdm-backup
    profiles: ["backup"]

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      DB_CONNECTION_STRING: ${DB_CONTAINER_CONNECTION_STRING:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-sgdm};Username=${POSTGRES_USER:-sgdm};Password=${POSTGRES_PASSWORD}}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-mai-secure}
      STORAGE_ENCRYPTION_ACTIVE_KEY: ${STORAGE_ENCRYPTION_ACTIVE_KEY:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_PG_SCHEMA: ${BACKUP_PG_SCHEMA:-public}

    volumes:
      - ./backups:/backups

  # ───────────────────────────────────────────────────────────────────────────
  # Controler de domeniu Samba AD - DOAR pentru laborator
  #
  # Nu porneste la 'docker compose up': e legat de profilul "ldap".
  #   docker compose --profile ldap up -d samba-ad
  #
  # Provizionarea domeniului si crearea OU-urilor, grupurilor si conturilor de
  # test: scripts/samba-ad-setup.ps1 (un singur rand per comanda, PowerShell).
  #
  # De ce e nevoie de privilegii ridicate: Samba AD ruleaza propriul DNS, isi
  # gestioneaza cheile Kerberos si scrie in /var/lib/samba. Exact de aceea
  # containerul asta NU are ce cauta in productie - acolo, DC-ul e un server
  # separat, administrat de altcineva.
  #
  # LDAPS: Samba isi genereaza singur certificatul la provizionare, in
  # /var/lib/samba/private/tls/ (ca.pem, cert.pem, key.pem). Scoaterea CA-ului
  # pentru API se face tot din scripts/samba-ad-setup.ps1.
  # ───────────────────────────────────────────────────────────────────────────
  samba-ad:
    image: nowsci/samba-domain:latest
    container_name: sgdm-samba-ad
    profiles: ["ldap"]
    restart: unless-stopped

    # Numele containerului in retea trebuie sa fie EXACT numele din certificat,
    # altfel validarea TLS esueaza chiar daca CA-ul e corect. API-ul foloseste
    # acelasi nume in LDAP_HOST.
    hostname: dc
    domainname: ${LDAP_REALM:-sgdm.local}

    privileged: true

    environment:
      DOMAIN: ${SAMBA_DOMAIN:-SGDM.LOCAL}
      DOMAINPASS: ${SAMBA_ADMIN_PASSWORD:-SCHIMBA_MA}
      DNSFORWARDER: ${SAMBA_DNS_FORWARDER:-1.1.1.1}
      HOSTIP: ${SAMBA_HOST_IP:-}

      # LDAP in clar pe 389 ramane inchis: chiar si in laborator, obisnuinta de
      # a lucra fara TLS se muta apoi in productie.
      INSECURELDAP: "false"

      # Politica de complexitate a parolelor ramane pornita: un domeniu de test
      # cu parole simple ascunde exact erorile care apar la primul cont real.
      NOCOMPLEXITY: "false"

    networks:
      default:
        aliases:
          # Numele pe care il pune API-ul in LDAP_HOST.
          - dc.${LDAP_REALM:-sgdm.local}

    ports:
      - "389:389"     # LDAP (inchis pentru bind, util pentru diagnosticare)
      - "636:636"     # LDAPS - aici vorbeste API-ul
      - "3268:3268"   # Global Catalog
      - "3269:3269"   # Global Catalog peste TLS

    volumes:
      - samba-data:/var/lib/samba
      - samba-config:/etc/samba/external
      - /etc/localtime:/etc/localtime:ro

# ─────────────────────────────────────────────────────────────────────────────
# Reteaua interna
#
# Subretea fixa, ca serviciul web sa poata avea IP fix (vezi KnownProxies).
# Daca 172.28.0.0/24 se suprapune cu reteaua institutiei (un calculator din
# LAN cu 172.28.0.x n-ar mai fi accesibil de pe gazda), alegeti alta in .env
# si mutati SGDM_PROXY_IP in ea.
#
# La prima pornire dupa aceasta schimbare, reteaua veche (fara subretea fixa)
# trebuie recreata:  docker compose down   (fara -v: datele raman)
# ─────────────────────────────────────────────────────────────────────────────
networks:
  default:
    ipam:
      config:
        - subnet: ${SGDM_DOCKER_SUBNET:-172.28.0.0/24}

volumes:
  pg-data:
    driver: local
  minio-data:
    driver: local
  samba-data:
    driver: local
  samba-config:
    driver: local
  api-storage:
    driver: local
  api-uploads:
    driver: local
