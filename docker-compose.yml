# ─────────────────────────────────────────────────────────────────────────────
# SGDM — infrastructura locala de stocare
#
# Ridica un MinIO auto-gazduit (S3-compatible) in care API-ul .NET pune
# cifrotextul transferurilor. Serverul nu poate citi continutul: fisierele
# ajung aici deja criptate AES-256-GCM in browser, iar cheia de fisier e
# impachetata RSA-OAEP pentru destinatar. MinIO vede doar octeti opaci.
#
# Pornire:   docker compose up -d
# Oprire:    docker compose down          (datele raman in volum)
# Stergere:  docker compose down -v       (STERGE si datele!)
# Consola:   http://localhost:9001
# ─────────────────────────────────────────────────────────────────────────────

services:

  minio:
    # Pentru demonstratie/practica 'latest' e in regula. In productie se
    # pineaza o versiune exacta (ex. minio/minio:RELEASE.2025-04-22T22-12-26Z)
    # ca un update automat sa nu schimbe comportamentul sub picioarele tale.
    image: minio/minio:latest
    container_name: sgdm-minio
    restart: unless-stopped

    # server /data   → unde tine obiectele
    # --console-address → portul interfetei web de administrare
    command: server /data --console-address ":9001"

    environment:
      # Credentialele de administrator ale MinIO. In .env, NU aici.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Browserul descarca cifrotextul direct de la MinIO (URL presemnat),
      # deci originea frontend-ului trebuie permisa explicit. In productie
      # se pune doar domeniul real al aplicatiei, nu '*'.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://localhost:3000"

      # Regiunea nu conteaza functional la MinIO, dar SDK-ul AWS o cere.
      MINIO_REGION_NAME: us-east-1

    ports:
      - "9000:9000"   # API S3 — aici vorbeste .NET si browserul
      - "9001:9001"   # Consola web de administrare

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ───────────────────────────────────────────────────────────────────────────
  # Container efemer: creeaza bucketul si politica de retentie, apoi iese.
  # Ruleaza la fiecare 'up', dar operatiile sunt idempotente.
  #
  # Versionare + stergere: pe un bucket versionat, DeleteObject fara VersionId
  # NU sterge octetii — pune un „delete marker”, iar obiectul devine versiune
  # noncurenta. Fara --noncurrent-expire-days, retragerea, stergerea si jobul
  # de expirare lasau cifrotextul in bucket pentru totdeauna, desi interfata
  # spunea „sters”. Acum versiunile vechi dispar fizic dupa o zi: fereastra de
  # recuperare pentru o stergere din greseala, nu arhiva.
  #
  # Expirarea la 30 de zile se aplica DOAR prefixului transfers/. Registrul de
  # documente scrie in acelasi bucket, sub documents/, iar o regula fara
  # prefix ar fi sters automat actele normative dupa o luna.
  #
  # Regulile ILM se sterg si se recreeaza la fiecare pornire. 'mc ilm rule add'
  # nu e idempotent — fiecare 'up' adauga inca o regula cu ID nou. Fara '|| true'
  # la adaugare: daca regula nu se poate crea, containerul trebuie sa esueze
  # vizibil, nu sa raporteze „MinIO pregatit” fara retentie.
  # ───────────────────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: sgdm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SGDM_BUCKET: ${STORAGE_BUCKET:-sgdm-transfers}
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";

      mc mb --ignore-existing local/$$SGDM_BUCKET;

      echo '→ bucket privat (fara acces anonim)';
      mc anonymous set none local/$$SGDM_BUCKET;

      echo '→ versionare activata: o stergere gresita se poate anula 24 de ore';
      mc version enable local/$$SGDM_BUCKET;

      echo '→ retentie: transferuri 30 de zile; versiuni sterse 1 zi; documentele NU expira';
      mc ilm rule rm --all --force local/$$SGDM_BUCKET >/dev/null 2>&1 || true;
      mc ilm rule add --prefix 'transfers/' --expire-days 30 local/$$SGDM_BUCKET;
      mc ilm rule add --noncurrent-expire-days 1 local/$$SGDM_BUCKET;

      echo '';
      echo '=== MinIO pregatit ===';
      mc ls local;
      "

  # ───────────────────────────────────────────────────────────────────────────
  # API-ul .NET
  #
  # Toate secretele vin din .env, niciunul din appsettings.json. Fisierul de
  # configurare versionat contine doar valori-sablon, iar Program.cs opreste
  # pornirea daca vreuna a ramas neinlocuita — un server care ruleaza cu cheia
  # "YOUR_JWT_SECRET_KEY_HERE" e mai rau decat unul care nu porneste, pentru ca
  # primul pare ca functioneaza.
  # ───────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sgdm-api:latest
    container_name: sgdm-api
    restart: unless-stopped

    depends_on:
      minio:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Conexiunea la baza de date. Daca folosesti Postgres-ul din acest compose,
      # hostul este "postgres", nu "localhost": in reteaua Docker, localhost e
      # containerul insusi.
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}

      # Secrete — generate cu:  openssl rand -base64 48
      MAI_JWT_KEY: ${MAI_JWT_KEY}
      MAI_ARGON2_PEPPER: ${MAI_ARGON2_PEPPER}
      MAI_TWOFACTOR_KEY: ${MAI_TWOFACTOR_KEY}

      # Endpointul MinIO vazut DIN container. Browserul, in schimb, primeste
      # URL-uri presemnate care trebuie sa fie rezolvabile de pe masina lui —
      # de aceea in productie ambele trebuie sa arate spre acelasi nume DNS.
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: ${STORAGE_BUCKET:-sgdm-transfers}
      MAI_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      MAI_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      # Originile frontend-ului. Fara ele, browserul refuza fiecare raspuns.
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}

      # In spatele unui reverse proxy: fara asta, toti utilizatorii ajung in
      # aceeasi galeata de rate limit, fiindca RemoteIpAddress e IP-ul proxy-ului.
      RateLimit__BehindReverseProxy: "false"

    ports:
      - "5000:8080"

    # Doar pentru Storage:Provider=Local. Cu MinIO ramane nefolosit, dar exista
    # ca sa nu se piarda fisiere daca cineva comuta providerul si reporneste.
    volumes:
      - api-storage:/app/Storage
      # Documentele NOI merg in MinIO, sub documents/. Volumul ramane pentru
      # versiunile scrise inainte de aceasta schimbare, care au in baza o cale
      # absoluta sub /app/uploads/documents si se citesc in continuare de acolo.
      # Fara volum, un 'docker compose up --build' le-ar sterge.
      - api-uploads:/app/uploads

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  minio-data:
    driver: local
  api-storage:
    driver: local
  api-uploads:
    driver: local

