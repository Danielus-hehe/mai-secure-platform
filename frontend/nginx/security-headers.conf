# ─────────────────────────────────────────────────────────────────────────────
# Antete de securitate pentru pagina aplicației și fișierele statice.
#
# Inclus în fiecare location static, nu pus o singură dată pe server: în
# nginx, un add_header dintr-un location ANULEAZĂ toate add_header moștenite
# de la server. Cum locațiile adaugă Cache-Control, antetele de la nivel de
# server ar dispărea tacit exact acolo unde contează.
#
# Nu se aplică pe /api/: acolo le pune API-ul (SecurityHeadersMiddleware).
# ─────────────────────────────────────────────────────────────────────────────

# CSP ca antet HTTP, pe lângă cea din <meta> din index.html. Browserul aplică
# AMBELE politici (intersecția lor), deci cea de aici o poate doar înăspri:
#   • connect-src 'self' - fără localhost:5000 / localhost:9000 din meta, care
#     există pentru `npm run dev`. În producție, un XSS nu poate trimite cheile
#     private decriptate din memorie nicăieri în afara originii aplicației;
#   • frame-ancestors - ignorat de browser când vine din <meta>; doar ca antet
#     are efect împotriva clickjacking-ului.
# Descărcarea cifrotextului merge prin /api/Transfers/{id}/content (same-origin),
# de aceea MinIO nu apare în connect-src (vezi Storage__UsePresignedDownload).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Un an de HTTPS obligatoriu pentru acest nume. Browserul ignoră HSTS primit
# pe o conexiune cu erori de certificat, deci certificatul autosemnat de
# demonstrație nu „blochează” numele pe mașina cuiva.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Izolează fereastra aplicației de ferestrele deschise din alte origini: o pagină
# străină deschisă din SGDM nu primește referință la window.opener.
add_header Cross-Origin-Opener-Policy "same-origin" always;
